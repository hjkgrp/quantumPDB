# Shared cluster parameters for all coordination integration cases.
defaults:
  modeller: true
  protoss: true
  coordination: true
  skip: all
  number_of_spheres: 3
  radius_of_first_sphere: 4.0
  capping_method: 1
  smoothing_method: 2
  include_ligands: 2
  compute_charges: true
  write_hetero_pdb: true
  count_residues: true
  write_xyz: true
  additional_ligands: []
  merge_distance_cutoff: 0.0
  optimize_select_residues: 1

cases:
  - case: ASP_proton
    pdb: 1k6w
    center_residues: [FE]
  - case: CSS_ligand
    pdb: 4kwk
    center_residues: [FE2]
  - case: CYS_ligand
    pdb: 4qm9
    center_residues: [FE]
  - case: GLU_proton
    pdb: 2ji1
    center_residues: [FE2]
  - case: HIS_flipping
    pdb: 6f2a
    center_residues: [FE2]
  - case: cluster_smoothing
    pdb: 6b9t
    center_residues: [FE]
  - case: deprotonated_HIS
    pdb: 3hpv
    center_residues: [FE2]
  - case: nitrile_hydratase_NO
    pdb: 2ahj
    center_residues: [FE]
  - case: nitrile_hydratase_covalent
    pdb: 3x20
    center_residues: [FE]
  - case: nitrile_hydratase_isonitrile
    pdb: 2zpg
    center_residues: [FE]
  - case: oxygen
    pdb: 1yfw
    center_residues: [FE]
  - case: partial_occupancy_AA_gt_other
    pdb: 5i0r
    center_residues: [FE]
  - case: partial_occupancy_large_gt_small
    pdb: 4xez
    center_residues: [FE]
  - case: fake_N_terminus
    pdb: 1lt3
    center_residues: [GAL]
  - case: atom_count
    pdb: 2d6o
    center_residues: [GAL]
  - case: polysacchride
    pdb: 2wt1
    center_residues: [GAL]
  - case: terminal_ligand
    pdb: 1jyn
    center_residues: [GAL]
    number_of_spheres: 2
  - case: polymer_nucleotide
    pdb: 4n48
    center_residues: [SAM_G]
    max_atom_count: 300
    merge_distance_cutoff: 4.0
  - case: COMT
    pdb: 4xud
    center_residues: [SAM_43H_MG]
    max_atom_count: 300
    merge_distance_cutoff: 4.0
  - case: isopeptide
    pdb: 1JG3
    center_residues: [ADN_IAS]
    max_atom_count: 300
    merge_distance_cutoff: 6.0
  - case: covalent_crosslink
    pdb: 5XXD
    center_residues: [SAM_8NR]
    max_atom_count: 300
    merge_distance_cutoff: 6.0
  - case: segmented_ligand
    pdb: 1NV8
    center_residues: [SAM_MEQ]
    max_atom_count: 300
    merge_distance_cutoff: 6.0
  - case: nsun2_9z2n
    pdb: 9Z2N
    # Cropped Step-3 neighborhood (A160–325 + SAH + RNA B45–51).
    # Residue-union centers; spheres=0 → specified-residue cluster.
    center_residues:
      - SER_A189-ASP_A215-ARG_A220-ASP_A242-ALA_A243-CYS_A267-ASP_A268-VAL_A269-PRO_A270-ALA_A271-SER_A272-LYS_A279-SER_A319-THR_A320-CYS_A321-SER_A322-SAH_A801-U_B47-A1C_B48-G_B49
    number_of_spheres: 0
    max_atom_count: 500
    merge_distance_cutoff: 5.0
    cluster_name_template: step3_C271A
