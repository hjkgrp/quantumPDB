name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  schedule:
    # Weekly smoke on the default branch (same as PR matrix)
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      os:
        description: Runner OS
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
      python-version:
        description: Python version
        required: true
        default: "3.12"
        type: choice
        options:
          - "3.10"
          - "3.11"
          - "3.12"

defaults:
  run:
    shell: bash -el {0}

jobs:
  test:
    name: Test on ${{ github.event.inputs.os || 'ubuntu-latest' }}, Python ${{ github.event.inputs.python-version || '3.12' }}
    runs-on: ${{ github.event.inputs.os || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          create-args: >-
            python=${{ github.event.inputs.python-version || '3.12' }}
          cache-environment: true
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict

      - name: Install package
        run: |
          python -m pip install . --no-deps
          micromamba list

      - name: Run tests
        run: |
          pytest -v --cov=qp --cov-report=xml --color=yes qp/tests/

      - name: CodeCov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ github.event.inputs.os || 'ubuntu-latest' }}-py${{ github.event.inputs.python-version || '3.12' }}
          fail_ci_if_error: false

  docs:
    name: Build Sphinx docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: docs/requirements.yaml
          environment-name: docs
          cache-environment: true
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict

      - name: Install package
        run: |
          python -m pip install . --no-deps

      - name: Build HTML documentation
        run: |
          cd docs
          make html
