name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up micromamba and install conda dependencies
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: qp
          cache-environment: true

      - name: Install qp package
        shell: bash -el {0}
        run: |
          python -m pip install -e . --no-deps
